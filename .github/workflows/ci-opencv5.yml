name: opencv5 5.0.0 overlay-port CI

# Validates that the overlay port in ./overlay-ports/opencv5 builds and installs
# for the requested official vcpkg triplets. The manifest under test lives in
# ./ci/opencv5 (separate from the root opencv4 manifest so both ports can be CI'd).
#
#   scope = core : x64-windows, x64-windows-static, x64-windows-static-md,
#                  x64-windows-release, x86-windows, x64-linux
#   scope = all  : core + arm64-windows, arm64-windows-static-md, arm64-osx,
#                  arm64-linux (cross), x64-android, arm64-android, arm-neon-android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Triplet set to build"
        type: choice
        options: [core, all]
        default: core

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'core' }}
  cancel-in-progress: true

env:
  # Same commit as the local vcpkg checkout this port was developed against,
  # so the official triplet definitions and dependency versions match exactly.
  # Also pinned as builtin-baseline in ci/opencv5/vcpkg.json.
  VCPKG_BASELINE: 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
  VCPKG_DISABLE_METRICS: "1"

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      scope: ${{ steps.gen.outputs.scope }}
    steps:
      - id: gen
        shell: bash
        run: |
          set -euo pipefail
          # Linux runners are pinned to ubuntu-24.04 (noble): the same base as the
          # official vcpkg CI image scripts/azure-pipelines/linux-arm64/Dockerfile
          # (FROM ubuntu:noble). "crosslinux" jobs provision the cross toolchain the
          # same way that image does and rely on vcpkg's own scripts/toolchains/linux.cmake
          # to auto-detect aarch64-linux-gnu-gcc (no hand-written chainload file).
          core='[
            {"triplet":"x64-windows",            "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"x64-windows-static",     "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"x64-windows-static-md",  "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"x64-windows-release",    "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"x86-windows",            "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"x64-linux",              "os":"ubuntu-24.04",   "android":false, "crosslinux":false}
          ]'
          extra='[
            {"triplet":"arm64-windows",           "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"arm64-windows-static-md", "os":"windows-latest", "android":false, "crosslinux":false},
            {"triplet":"arm64-osx",               "os":"macos-latest",   "android":false, "crosslinux":false},
            {"triplet":"arm64-linux",             "os":"ubuntu-24.04",   "android":false, "crosslinux":true},
            {"triplet":"x64-android",             "os":"ubuntu-24.04",   "android":true,  "crosslinux":false},
            {"triplet":"arm64-android",           "os":"ubuntu-24.04",   "android":true,  "crosslinux":false},
            {"triplet":"arm-neon-android",        "os":"ubuntu-24.04",   "android":true,  "crosslinux":false}
          ]'

          scope='${{ inputs.scope || 'core' }}'
          if [ "$scope" = "all" ]; then
            matrix=$(printf '%s\n%s\n' "$core" "$extra" | jq -sc '.[0] + .[1]')
          else
            scope=core
            matrix="$core"
          fi
          matrix=$(printf '%s' "$matrix" | jq -c .)

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "Planned triplets for scope '$scope':"
          printf '%s' "$matrix" | jq -r '.[] | "  \(.triplet)  ->  \(.os)"'

  build:
    name: install ${{ matrix.triplet }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          if [ "${{ matrix.android }}" != "true" ]; then
            sudo rm -rf /usr/local/lib/android || true
          fi
          df -h /

      # Package set mirrors the official vcpkg CI image
      # (scripts/azure-pipelines/linux-arm64/Dockerfile, FROM ubuntu:noble): the
      # autotools/nasm/yasm/gperf/python toolchain plus the full X11/GL/xorg stack
      # that image ships. opencv5's default features additionally pull gtk3, whose
      # vcpkg ports declare a few extra system needs not in that image:
      #   at-spi2-core -> libxi-dev libxtst-dev (in image)
      #   libepoxy     -> libx11-dev libgles2-mesa-dev (gles2 is extra)
      #   glib         -> libselinux1-dev (extra)
      #   gtk3         -> xrandr, plus libltdl-dev/libdbus-1-dev (extra)
      - name: Install Linux build prerequisites (vcpkg CI image parity)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            autoconf autoconf-archive automake autopoint \
            libtool libtool-bin libltdl-dev m4 \
            pkg-config gettext bison flex \
            nasm yasm gperf zip unzip tar git python3 python3-pip python3-setuptools python3-venv \
            libnuma1 libnuma-dev libudev-dev libtirpc-dev \
            libdbus-1-dev libselinux1-dev libgles2-mesa-dev

      - name: Install X11/GL development packages (vcpkg CI image parity)
        if: runner.os == 'Linux' && matrix.android == false
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxtst-dev libxi-dev libxrandr-dev \
            libxxf86vm-dev libxext-dev libxfixes-dev libxrender-dev \
            libxdamage-dev libxcomposite-dev libxau-dev libxdmcp-dev \
            libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-util0-dev \
            libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxinerama-dev \
            libglu1-mesa-dev libgl1-mesa-dev libgl-dev mesa-common-dev \
            libxmu-dev xorg-dev

      - name: Export Android NDK location
        if: matrix.android
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | tail -n1 || true)
          fi
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::No Android NDK found on this runner"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "Using Android NDK: $ndk"

      # Mirrors scripts/azure-pipelines/linux-arm64/Dockerfile: install the gcc-13
      # cross toolchain and register it with update-alternatives exactly like the
      # image does, so plain `aarch64-linux-gnu-gcc/g++/gfortran` resolve to gcc-13.
      # No hand-written chainload file: vcpkg's own scripts/toolchains/linux.cmake
      # auto-detects ${GNU_TRIPLET}-gcc when the target is arm64 — this is what the
      # official CI does and keeps the stock triplets' behavior identical.
      #
      # Documented deviation from the image: opencv5 is tested with its DEFAULT
      # features, which on Linux include gtk3. Official CI never builds opencv on
      # arm64-linux (scripts/ci.baseline.txt omits it), so the image only ships the
      # amd64 X11 dev packages. gtk3's cairo runs a meson link test for
      # XRenderCreateConicalGradient that must link an *arm64* libXrender, and
      # vcpkg's X11 ports are EMPTY packages on non-Windows (ports/libxrender
      # declares VCPKG_POLICY_EMPTY_PACKAGE), so the arm64 variants are added here.
      # The official triplets themselves stay untouched; this only supplies
      # target-arch system libraries.
      - name: Prepare arm64 cross toolchain (vcpkg CI image parity)
        if: matrix.crosslinux == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu gfortran-13-aarch64-linux-gnu
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-13 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-g++ aarch64-linux-gnu-g++ /usr/bin/aarch64-linux-gnu-g++-13 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gfortran aarch64-linux-gnu-gfortran /usr/bin/aarch64-linux-gnu-gfortran-13 100
          aarch64-linux-gnu-gcc --version | head -n1

          # arm64 variants of the X11 dev packages (see header comment).
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev:arm64 libxext-dev:arm64 libxrender-dev:arm64 \
            libxrandr-dev:arm64 libxi-dev:arm64 libxtst-dev:arm64 \
            libxfixes-dev:arm64 libxdamage-dev:arm64 libxcomposite-dev:arm64 \
            libxinerama-dev:arm64 libxcursor-dev:arm64
          # Point pkg-config at the arm64 .pc files first so meson resolves the
          # target-arch X11 libraries. PKG_CONFIG_PATH (set by vcpkg) still wins for
          # vcpkg-provided packages.
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout %VCPKG_BASELINE%
          vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_BASELINE"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Show overlay port under test
        shell: bash
        run: |
          echo "baseline : $VCPKG_BASELINE"
          echo "triplet  : ${{ matrix.triplet }}"
          grep -E '"(name|version|port-version)"' overlay-ports/opencv5/vcpkg.json
          echo "patches  : $(ls -1 overlay-ports/opencv5 | grep -cE '\.(patch|diff)$')"

      - name: Resolve manifest (dry run, Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ci/opencv5
        run: '%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }} --dry-run'

      - name: Resolve manifest (dry run, Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ci/opencv5
        run: "$GITHUB_WORKSPACE/vcpkg/vcpkg install --triplet ${{ matrix.triplet }} --dry-run"

      - name: Build and install opencv5 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ci/opencv5
        run: '%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }} --clean-after-build'

      - name: Build and install opencv5 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ci/opencv5
        run: "$GITHUB_WORKSPACE/vcpkg/vcpkg install --triplet ${{ matrix.triplet }} --clean-after-build"

      - name: Verify installed artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="ci/opencv5/vcpkg_installed/${{ matrix.triplet }}"
          test -d "$root" || { echo "::error::install root missing: $root"; exit 1; }
          ls -la "$root"
          test -d "$root/include/opencv5/opencv2" \
            || { echo "::error::opencv2 headers missing in $root"; exit 1; }
          # Search the whole install root, not just lib/ and bin/: Android installs
          # its static libraries under sdk/native/staticlibs/<abi>/, and static
          # triplets have no bin/ at all. Only real library extensions count, so
          # CMake metadata that merely mentions opencv_core is not a hit. `find`
          # exits non-zero on an unreadable path, hence `|| true`.
          count=$(find "$root" -type f \( \
                    -iname '*opencv_core*.a' -o -iname '*opencv_core*.lib' \
                    -o -iname '*opencv_core*.so*' -o -iname '*opencv_core*.dll' \
                    -o -iname '*opencv_core*.dylib' \) 2>/dev/null | wc -l || true)
          echo "opencv_core artifacts: $count"
          test "$count" -gt 0 || { echo "::error::opencv_core library missing under $root"; exit 1; }

      # No -G Ninja on purpose. On windows-latest the Ninja generator picks the
      # MinGW gcc that sits on PATH, while triplet x64-windows is built with MSVC.
      # Mixing those ABIs fails at link time with undefined references to cv::Mat,
      # cv::Mat::eye and cv::sum. The default Visual Studio generator keeps the
      # consumer on MSVC, matching the triplet.
      - name: Consume the port with CMake (x64-windows only)
        if: matrix.triplet == 'x64-windows'
        shell: cmd
        run: |
          cmake -S . -B build -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_MANIFEST_MODE=OFF ^
            -DVCPKG_INSTALLED_DIR=%GITHUB_WORKSPACE%\ci\opencv5\vcpkg_installed ^
            -DTESTCAP_WITH_OPENCV=ON
          cmake --build build --config Release
          build\Release\testcap.exe

      # GitHub archives job logs only after the job ends, and fetching a raw log
      # requires authentication. Emit the real cause as an annotation so it stays
      # readable without a token:
      #   GET /repos/{owner}/{repo}/check-runs/{id}/annotations
      - name: Surface failure cause as annotation
        if: failure()
        shell: bash
        run: |
          set +e
          msg=$(
            grep -rhoiE "error: building [^ ]+ failed with: [A-Z_]+" ci/opencv5/vcpkg/buildtrees 2>/dev/null | sort -u | head -2
            grep -rhA10 "CMake Error at .*vcpkg_make.cmake" ci/opencv5/vcpkg/buildtrees 2>/dev/null | grep -iE "requires|depends on|apt install|dnf install" | sort -u | head -4
            grep -rhoiE 'ERROR: Dependency "[^"]+" not found' ci/opencv5/vcpkg/buildtrees 2>/dev/null | sort -u | head -6
            grep -rhoE "CMake Error at [^:]+:[0-9]+" ci/opencv5/vcpkg/buildtrees 2>/dev/null | sort -u | head -4
            grep -rhoiE "error C[0-9]{4}: [^\"']{0,90}" ci/opencv5/vcpkg/buildtrees 2>/dev/null | sort -u | head -4
            grep -rhoiE "undefined reference to [^\"']{0,90}" ci/opencv5/vcpkg/buildtrees/opencv5 2>/dev/null | sort -u | head -4
          )
          echo "--- failure summary for ${{ matrix.triplet }} ---"
          echo "$msg"
          msg=${msg//'%'/'%25'}
          msg=${msg//$'\r'/}
          msg=${msg//$'\n'/'%0A'}
          echo "::error::${msg:0:900}"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.triplet }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ci/opencv5/vcpkg/buildtrees/opencv5/*.log
            ci/opencv5/vcpkg/buildtrees/opencv5/install-*.log
            ci/opencv5/vcpkg/buildtrees/**/config-*.log
